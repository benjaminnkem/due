<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --green:#0e4a37; --ink:#11201a; --muted:#5d6b64; --paper:#f6f7f3; --line:#dfe3da; --sun:#ffd23f; --brick:#b4382a; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Hanken Grotesk", sans-serif; }
  .wrap { display: grid; grid-template-columns: 700px 1fr; width: 1280px; height: 640px; }
  .hero { position: relative; overflow: hidden; background: var(--green); color: #f3f7ef; padding: 48px 56px; border-radius: 0 40px 40px 0; display: flex; flex-direction: column; }
  .hero::after { content: ""; position: absolute; right: -110px; bottom: -110px; width: 420px; height: 420px; border-radius: 50%; border: 64px solid rgba(255,255,255,.05); }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 40px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
  .brand img { width: 46px; height: 46px; }
  .lede { margin-top: 44px; max-width: 360px; font: 500 28px/1.2 "Bricolage Grotesque", sans-serif; opacity: .92; }
  .figure { margin-top: auto; display: flex; align-items: flex-end; gap: 18px; font: 800 300px/.78 "Bricolage Grotesque", sans-serif; letter-spacing: -.06em; font-variation-settings: "opsz" 96; padding-bottom: 6px; }
  .figure small { font: 700 46px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; padding-bottom: 38px; opacity: .85; }
  .side { padding: 52px 56px 40px 48px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  h2 { font: 700 34px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; } h2 span { color: var(--muted); font-weight: 500; }
  .row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 20px; }
  .row:first-of-type { border-top: 1px solid var(--line); } .row dt { color: var(--muted); } .row dd { margin: 0; font-weight: 600; }
  .checks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .check { background: #fff; border: 1.5px solid var(--green); border-radius: 16px; padding: 14px 12px; font: 600 16px/1.2 "Hanken Grotesk"; display: grid; gap: 8px; }
  .check i { width: 28px; height: 28px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
  .check i::after { content: ""; width: 6px; height: 12px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(40deg) translate(-1px,-1px); }
  .check small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .attempt { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border: 1.5px solid var(--line); border-radius: 16px; background: #fff; }
  .attempt b { font: 700 20px/1 "Hanken Grotesk"; } .attempt p { margin-top: 6px; font: 400 15px/1 ui-monospace, "SF Mono", monospace; color: var(--muted); }
  .pill { font: 700 15px/1 "Hanken Grotesk"; padding: 8px 14px; border-radius: 999px; background: #f6dcd7; color: var(--brick); }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand"><img src="logo-sun.svg" alt="">Due</div>
    <p class="lede">A Stellar invoice that only settles an exact, on-time payment.</p>
    <div class="figure">10<small>USDC</small></div>
  </div>
  <div class="side">
    <h2>Invoice <span>invoice 20 test</span></h2>
    <dl>
      <div class="row"><dt>Pay to</dt><dd>GB3M…H2VK</dd></div>
      <div class="row"><dt>Paid by</dt><dd>GC3C…IU4V</dd></div>
    </dl>
    <div class="checks">
      <div class="check"><i></i><span>Right asset<small>USDC</small></span></div>
      <div class="check"><i></i><span>Right amount<small>exactly 10</small></span></div>
      <div class="check"><i></i><span>On time<small>before the deadline</small></span></div>
    </div>
    <div class="attempt"><div><b>Pay 9 USDC</b><p>98df0db46e…eb81</p></div><span class="pill">WrongAmount</span></div>
  </div>
</div>
</body>
</html>
